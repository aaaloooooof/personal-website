<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>周报详情 | aaaloooooof</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #f8f5ef, #efebe4);
      color: #1f2633;
    }
    a { color: inherit; text-decoration: none; }
    .page { width: min(900px, calc(100% - 28px)); margin: 0 auto; padding: 32px 0 48px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 999px;
      color: #56606f; background: rgba(255,255,255,0.8); border: 1px solid rgba(56,56,56,0.08);
    }
    .panel {
      margin-top: 18px; padding: 28px; border-radius: 28px; background: rgba(255,255,255,0.8);
      border: 1px solid rgba(66,62,56,0.08); box-shadow: 0 18px 48px rgba(85,68,44,0.08);
    }
    .eyebrow { color: #8c7454; font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: 2rem; line-height: 1.2; }
    .summary { margin: 0 0 24px; color: #5f6674; line-height: 1.9; }
    .notes { display: grid; gap: 12px; margin: 24px 0; }
    .note {
      padding: 16px 18px; border-radius: 20px; background: linear-gradient(180deg, rgba(255,255,255,0.94), rgba(247,243,237,0.88));
      border: 1px solid rgba(75, 69, 61, 0.08); color: #4e5562; line-height: 1.85;
    }
    .refs { display: grid; gap: 10px; }
    .ref { display: inline-flex; align-items: center; gap: 10px; color: #7f6547; width: fit-content; }
  </style>
</head>
<body>
  <div class="page">
    <a class="back-link" id="back-link" href="weekly.html">← 返回周报</a>
    <div class="panel">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p class="summary" id="summary"></p>
      <div class="notes" id="notes"></div>
      <div class="refs" id="refs"></div>
    </div>
  </div>
  <script src="data/weekly-data.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const weekSlug = params.get("week");
      const postSlug = params.get("post");
      const data = window.WEEKLY_DATA;
      if (!data || !data.weeks) return;
      const week = data.weeks.find(function (item) { return item.slug === weekSlug; }) || data.weeks[0];
      if (!week) return;
      document.getElementById("back-link").href = postSlug ? "weekly.html" : "weekly-archive.html";
      if (!postSlug) {
        document.getElementById("eyebrow").textContent = week.year + " / 第 " + week.week + " 周";
        document.getElementById("title").textContent = week.theme;
        document.getElementById("summary").textContent = week.summary;
        document.getElementById("notes").innerHTML = week.articles.map(function (article) {
          const href = "weekly-post.html?week=" + encodeURIComponent(week.slug) + "&post=" + encodeURIComponent(article.slug);
          return '<a class="note" href="' + href + '"><strong>' + article.title + '</strong><br>' + article.summary + '</a>';
        }).join("");
        return;
      }
      const article = week.articles.find(function (item) { return item.slug === postSlug; });
      if (!article) return;
      document.getElementById("eyebrow").textContent = week.year + " / 第 " + week.week + " 周 · " + article.category;
      document.getElementById("title").textContent = article.title;
      document.getElementById("summary").textContent = article.summary;
      document.getElementById("notes").innerHTML = (article.notes || []).map(function (note) {
        return '<div class="note">' + note + '</div>';
      }).join("");
      document.getElementById("refs").innerHTML = (article.references || []).map(function (ref) {
        return '<a class="ref" href="' + ref.url + '">' + ref.label + ' →</a>';
      }).join("");
    })();
  </script>
</body>
</html>
