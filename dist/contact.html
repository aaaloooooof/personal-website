<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>联系信息 | aaaloooooof</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at center, rgba(28,38,65,0.18), transparent 45%),
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px),
        #060606;
      background-size: auto, 44px 44px, 44px 44px, auto;
      color: #e8edf6;
      min-height: 100vh;
    }
    .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
    .panel { width: min(860px, 100%); border-radius: 26px; border: 1px solid rgba(255,255,255,0.08); background: rgba(10, 14, 24, 0.72); box-shadow: 0 18px 80px rgba(0,0,0,0.38); backdrop-filter: blur(14px); padding: 32px 30px 28px; }
    .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .topbar img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.88); }
    .topbar-text h1 { margin: 0 0 4px; font-size: 1.5rem; color: #fff; }
    .topbar-text p { margin: 0; color: #c8cfda; font-size: 0.92rem; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: #d8e0ee; margin-bottom: 18px; opacity: .88; text-decoration: none; }
    .back-link:hover { opacity: 1; color: #fff; }
    .section-title { margin: 0 0 12px; font-size: 1.85rem; color: #fff; }
    .section-text { margin: 0; color: #d1d8e5; line-height: 1.9; font-size: 1rem; }
    .cursor-glow { position: fixed; left: 0; top: 0; width: 14px; height: 14px; margin-left: -7px; margin-top: -7px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(173,216,255,0.42) 45%, rgba(173,216,255,0) 75%); pointer-events: none; z-index: 9999; opacity: .82; transform: translate3d(-100px, -100px, 0); transition: transform .08s linear; mix-blend-mode: screen; }
    a.inline-link { color: #ecf2fb; word-break: break-all; }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.matchMedia('(hover: hover)').matches) {
        const glow = document.createElement('div');
        glow.className = 'cursor-glow';
        document.body.appendChild(glow);
        window.addEventListener('mousemove', (event) => {
          glow.style.transform = `translate3d(${event.clientX}px, ${event.clientY}px, 0)`;
        });
      }
    });
  </script>
</head>
<body>
  <div class="page">
    <div class="panel">
      <a class="back-link" href="index.html">← 返回首页</a>
      <div class="topbar">
        <img src="assets/avatar.jpg" alt="avatar">
        <div class="topbar-text">
          <h1>aaaloooooof</h1>
          <p>it turns a sandwich into a baquet</p>
        </div>
      </div>
      <h2 class="section-title">联系信息</h2>
      <p class="section-text"><a class="inline-link" href="mailto:51284102015@stu.ecnu.edu.cn">51284102015@stu.ecnu.edu.cn</a><br><a class="inline-link" href="https://github.com/aaaloooooof" target="_blank" rel="noopener noreferrer">https://github.com/aaaloooooof（小菜求轻喷）</a></p>
    </div>
  </div>
</body>
</html>
